# Keys only: no SSH password logins (Steve, 2026-10-21: "I don't want passwords ... I want certificates or trusting").
# On Rosie and H2-Host every login for 60 days was by key. 00- is read before Ubuntu's 50-cloud-init.conf,
# and sshd keeps the first value it reads, so this wins. Installed by scripts/install_system_settings.sh.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
