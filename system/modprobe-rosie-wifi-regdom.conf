# Rosie's Wi-Fi country, set explicitly (2026-10-04). It was unset ("00", WORLD): with a weak signal
# the Realtek rtl88x2ce driver dropped to the WORLD rules and hopped channels (5 GHz -> 2.4 GHz),
# and all four kernel deaths of 2026-10-04 came within 0-6 s of such a hop or reconnect.
# Installed as /etc/modprobe.d/rosie-wifi-regdom.conf
options cfg80211 ieee80211_regdom=US
