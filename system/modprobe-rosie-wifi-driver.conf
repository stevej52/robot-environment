# Rosie's Wi-Fi on the in-kernel rtw88 driver, not Realtek's out-of-tree rtl8822ce (2026-10-04: all
# four kernel deaths came within 0-6 s of the vendor driver hopping channels). rosie-wifi-fallback
# removes this file and reloads the vendor driver if rtw88 does not bring her online at boot.
# Installed as /etc/modprobe.d/rosie-wifi-driver.conf
blacklist rtl8822ce
# The stability settings rtw88 users run this chip with: no deep power save, no PCIe link power
# management (both are known sources of hangs on RTL8822CE).
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y
