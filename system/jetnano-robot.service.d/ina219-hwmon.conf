# The battery INA219 (bus 1, 0x41) is read through the kernel's ina2xx driver instead of
# userspace smbus: the bus is shared with the kernel's INA3221 (0x40) and userspace reads
# came back garbled - exactly 7.37 V, the config register, 44 times on 2026-10-01. Bind the
# driver before the stack starts (idempotent); the breakout's shunt is 0.1 ohm = 100000 uOhm.
# battery_monitor finds it as /sys/class/hwmon/*/name == "ina219".
# Installed as /etc/systemd/system/jetnano-robot.service.d/ina219-hwmon.conf
[Service]
ExecStartPre=+/bin/sh -c 'modprobe ina2xx 2>/dev/null; [ -e /sys/bus/i2c/devices/1-0041 ] || echo ina219 0x41 > /sys/bus/i2c/devices/i2c-1/new_device; sleep 0.5; for h in /sys/bus/i2c/devices/1-0041/hwmon/hwmon*; do echo 100000 > $h/shunt_resistor 2>/dev/null; done; true'
