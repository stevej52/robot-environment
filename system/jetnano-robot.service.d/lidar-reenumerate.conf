# The RPLidar's CP2102 (10c4:ea60) often comes up wedged after a hard reset: the driver
# prints "RPLIDAR running" and then hangs, and the watchdog only fixes it ~90 s later with
# this same re-enumeration (2026-10-01, both boots after the kernel panic). Do it once
# before the stack starts: about 4 s. Runs as root ('+'), needs no sudo.
# Installed as /etc/systemd/system/jetnano-robot.service.d/lidar-reenumerate.conf
[Service]
ExecStartPre=+/bin/sh -c '[ -e /run/rosie-lidar-reenumerated ] && exit 0; for d in /sys/bus/usb/devices/*; do [ "$(cat $d/idVendor 2>/dev/null)" = 10c4 ] && [ "$(cat $d/idProduct 2>/dev/null)" = ea60 ] && { echo 0 > $d/authorized; sleep 1.5; echo 1 > $d/authorized; sleep 6; touch /run/rosie-lidar-reenumerated; echo "jetnano-robot: lidar USB re-enumerated at $d"; }; done; true'
# Once per BOOT (/run is cleared at boot), not on every service restart: both boots with it
# opened first time, but both service restarts with it (22:54 on 2026-10-01, 07:09 on 10-02)
# timed out on the first open after the re-enumeration and hung until the watchdog's
# restart - a restart without it had been fine. A wedged CP2102 is a hard-reset thing.
# sleep 6, not 2.5: on a service restart (22:54, 2026-10-01) the driver opened the port 2 s after
# the re-enumeration and got "operation time out" - the A1's MCU was still coming up - and then
# hung until the watchdog killed it 90 s later. Both boots with 3 s were fine; 6 s is margin.
