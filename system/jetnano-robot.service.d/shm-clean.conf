# Fast-DDS leaves its shared-memory port files in /dev/shm when a process dies hard (the
# 2026-10-01 20:58 kernel panic): every new ROS process afterwards printed
# "RTPS_TRANSPORT_SHM Error: Failed init_port fastrtps_portNNNN: open_and_lock_file failed"
# and fell back to UDP for that port. Clean them before the stack starts; nothing of ours
# uses them across a restart (the Isaac container is UDP-only).
# Installed as /etc/systemd/system/jetnano-robot.service.d/shm-clean.conf
[Service]
ExecStartPre=/bin/sh -c 'rm -f /dev/shm/fastrtps_* /dev/shm/sem.fastrtps_* 2>/dev/null; true'
