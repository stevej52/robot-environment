# Fast DDS without shared memory for every node the service starts (and everything the
# watchdog relaunches from inside it): see system/fastdds_udp_only.xml for why (2026-10-02).
# The same drop-in goes under jetnano-voice.service.d, jetnano-localize.service.d and
# jetnano-slam.service.d; Nav2 and the drive scripts export the variable themselves.
# Installed as /etc/systemd/system/jetnano-robot.service.d/udp-only.conf
[Service]
Environment=FASTRTPS_DEFAULT_PROFILES_FILE=/etc/jetnano/fastdds_udp_only.xml
