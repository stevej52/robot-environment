# KillMode=mixed: systemd's stop signal (SIGINT) goes to the launch only, and the launch passes
# it to its nodes once. With the default control-group mode every node got SIGINT twice - from
# systemd and from the launch - and the second one interrupted destroy_node(): a traceback and
# "process has died, exit code -2" for every node on every clean restart (2026-10-01). What is
# still alive at TimeoutStopSec gets SIGKILL from systemd as before.
# Installed as /etc/systemd/system/jetnano-robot.service.d/killmode.conf
[Service]
KillMode=mixed
