# Rosie: the hardware watchdog resets her 20 s after the kernel or PID 1 stops answering
# (JetPack's watchdog.conf has 120 s). A hang that cannot even panic would otherwise leave the
# servo board running on its last pulses for two minutes. RebootWatchdogSec: how long a
# reboot may take before the watchdog forces it.
[Manager]
RuntimeWatchdogSec=20
RebootWatchdogSec=120
