# Rosie: a kernel crash reboots her in 5 s (the stock 0 waits for ever).
# 2026-09-28 13:14: an oops in the GPU driver (nvgpu, a camera pipeline exiting) panicked the
# kernel with her parked; only the systemd hardware watchdog brought her back, 2 min 46 s later.
# A crash is a crash on a robot: the servo board keeps its last pulses until the Jetson resets
# (and, with the OE wire, not past the reset). panic_on_oops is already 1 in JetPack.
kernel.panic = 5
kernel.panic_on_oops = 1
