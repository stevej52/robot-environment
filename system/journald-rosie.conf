# Rosie: keep the start of every boot in the journal.
# Installed as /etc/systemd/journald.conf.d/zz-rosie.conf (scripts/install_system_settings.sh).
#
# 2026-09-28: most boots' saved journals began 11-56 s in - the kernel's boot
# messages and journald's own were gone, the place a crash would be read from.
# The journal directory held 101 files (39 system, 62 user) against journald's
# default SystemMaxFiles=100, so every rotation deleted the "oldest" archive by
# its head timestamp. Rosie has no RTC battery: the start of a boot is stamped
# with the wrong time (1970 once nvvrs-pseq-rtc resets the clock at ~11 s) and a
# clock jump rotates the file, so that archive looked oldest and went first. The
# same backwards jumps made 30+ one-entry files on 2026-09-26.
#
# Limited by size instead (the 4 GB default cap stays; the disk has 300+ GB free).
[Journal]
SystemMaxFiles=2000
